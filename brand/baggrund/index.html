<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webleads · Levende baggrund</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:opsz,wght@9..40,500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<!--
  Animated desktop background: the Webleads app icon as a glossy tile floating in warm light.
  Made for a 16" MacBook Pro (3456 × 2234) and scaled to fill any screen. Show it with an app that
  uses a web page as the wallpaper, such as Plash.
  It follows the Mac's light or dark mode. In the address: ?tema=lys or ?tema=moerk fixes the look,
  ?tekst=nej leaves out the name, and the tile then sits in the middle.
  Every animation repeats within 12 seconds, so a recording of 12 seconds loops seamlessly.
-->
<style>
  :root {
    --bg: linear-gradient(to bottom right, #ffe3d4 0%, #f6ece3 50%, #efd9c9 100%);
    --b1: rgba(255,255,255,.75); --b2: rgba(240,120,80,.30); --b3: rgba(224,85,43,.18);
    --sh1: rgba(120,45,20,.42); --sh2: rgba(110,35,15,.30);
    --ink: #111111; --sub: rgba(17,17,17,.62); --small: rgba(17,17,17,.42);
    --edge: #b43a18; --glow: 0 0 0 transparent;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-tema="lys"]) {
    --bg: linear-gradient(to bottom right, #1d1714 0%, #120f0e 55%, #0c0b0a 100%);
    --b1: rgba(255,170,130,.10); --b2: rgba(224,85,43,.30); --b3: rgba(224,85,43,.12);
    --sh1: rgba(224,85,43,.38); --sh2: rgba(0,0,0,.55);
    --ink: #f4efe8; --sub: rgba(244,239,232,.62); --small: rgba(244,239,232,.40);
    --edge: #9e3214; --glow: 0 0 160px rgba(224,85,43,.35);
  } }
  :root[data-tema="moerk"] {
    --bg: linear-gradient(to bottom right, #1d1714 0%, #120f0e 55%, #0c0b0a 100%);
    --b1: rgba(255,170,130,.10); --b2: rgba(224,85,43,.30); --b3: rgba(224,85,43,.12);
    --sh1: rgba(224,85,43,.38); --sh2: rgba(0,0,0,.55);
    --ink: #f4efe8; --sub: rgba(244,239,232,.62); --small: rgba(244,239,232,.40);
    --edge: #9e3214; --glow: 0 0 160px rgba(224,85,43,.35);
  }

  html, body { margin: 0; height: 100%; overflow: hidden; background: #f6ece3; }
  @media (prefers-color-scheme: dark) { html:not([data-tema="lys"]), html:not([data-tema="lys"]) body { background: #120f0e; } }
  html[data-tema="moerk"], html[data-tema="moerk"] body { background: #120f0e; }

  /* The design is drawn at 3456 × 2234 and scaled to cover the screen */
  .stage { position: absolute; left: 50%; top: 50%; width: 3456px; height: 2234px; transform: translate(-50%, -50%) scale(var(--s, 1)); transform-origin: 50% 50%; background: var(--bg); overflow: hidden; }

  /* Layout with the name (default) and without it */
  .stage { --cx: 1260px; --cy: 1020px; --S: 840px; --k: 1; }
  .uden-tekst .stage { --cx: 1728px; --cy: 1000px; --S: 980px; --k: 1.1667; }
  .uden-tekst .word { display: none; }

  .blob { position: absolute; border-radius: 50%; will-change: transform; }
  .blob--1 { width: 3000px; height: 3000px; left: calc(var(--cx) - 560px - 1500px); top: calc(500px - 1500px); background: radial-gradient(closest-side, var(--b1), transparent); animation: drift1 12s ease-in-out infinite; }
  .blob--2 { width: 2600px; height: 2600px; left: calc(var(--cx) - 10px - 1300px); top: calc(var(--cy) + 480px - 1300px); background: radial-gradient(closest-side, var(--b2), transparent); animation: drift2 12s ease-in-out infinite; }
  .blob--3 { width: 2800px; height: 2800px; left: calc(3000px - 1400px); top: calc(1900px - 1400px); background: radial-gradient(closest-side, var(--b3), transparent); animation: drift1 12s ease-in-out -6s infinite; }

  /* The shadow on the floor shrinks and fades as the tile rises */
  .floor { position: absolute; left: var(--cx); top: calc(var(--cy) + var(--S) * .83); width: 0; height: 0; animation: shadow 6s ease-in-out infinite; }
  .floor i { position: absolute; border-radius: 50%; transform: rotate(-4.6deg); }
  .floor i:nth-child(1) { width: calc(1120px * var(--k)); height: calc(240px * var(--k)); left: calc(-560px * var(--k)); top: calc(-120px * var(--k)); background: var(--sh1); filter: blur(90px); }
  .floor i:nth-child(2) { width: calc(720px * var(--k)); height: calc(120px * var(--k)); left: calc(-380px * var(--k)); top: calc(-80px * var(--k)); background: var(--sh2); filter: blur(30px); }

  /* The tile: 28 layers make the edge, the face has a gloss and a light sweep, the arrow floats above it */
  .scene { position: absolute; left: calc(var(--cx) - var(--S) / 2); top: calc(var(--cy) - var(--S) / 2); width: var(--S); height: var(--S); perspective: calc(2600px * var(--k)); }
  .bob { position: absolute; inset: 0; transform-style: preserve-3d; animation: float 6s ease-in-out infinite; }
  .tile { position: absolute; inset: 0; transform-style: preserve-3d; animation: sway 12s ease-in-out infinite; }
  .l { position: absolute; inset: 0; border-radius: calc(var(--S) / 4); background: var(--edge); transform: translateZ(calc(var(--z) * -3px * var(--k))); }
  .l:nth-child(-n+3) { background: #d04a22; }
  .face { position: absolute; inset: 0; border-radius: calc(var(--S) / 4); overflow: hidden;
    background: linear-gradient(150deg, #ff875a 0%, #e85d31 38%, #d94e25 70%, #c9441e 100%);
    box-shadow: inset 0 calc(14px * var(--k)) calc(28px * var(--k)) rgba(255,235,225,.55), inset 0 calc(-26px * var(--k)) calc(46px * var(--k)) rgba(120,30,10,.35), var(--glow); }
  .gloss { position: absolute; inset: 0; background: radial-gradient(120% 80% at 18% 8%, rgba(255,255,255,.55), rgba(255,255,255,0) 45%); }
  .sheen { position: absolute; top: -40%; bottom: -40%; width: 26%; left: 0; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.38), rgba(255,255,255,0)); animation: sheen 12s ease-in-out infinite; }
  .arrow { position: absolute; inset: 0; animation: lift 6s ease-in-out -1.5s infinite; }
  .arrow svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 calc(18px * var(--k)) calc(18px * var(--k)) rgba(110,25,5,.45)); }

  .word { position: absolute; inset: 0; width: 3456px; height: 2234px; }

  .grain { position: absolute; inset: 0; mix-blend-mode: overlay; opacity: .55; pointer-events: none; }

  @keyframes float { 0%, 100% { transform: translate3d(0, 0, 0); } 50% { transform: translate3d(0, -36px, 0); } }
  @keyframes sway { 0%, 100% { transform: rotateX(18deg) rotateY(-24deg) rotateZ(-7deg); } 50% { transform: rotateX(14deg) rotateY(-17deg) rotateZ(-4.5deg); } }
  @keyframes lift { 0%, 100% { transform: translateZ(calc(26px * var(--k))); } 50% { transform: translateZ(calc(46px * var(--k))); } }
  @keyframes shadow { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.86); opacity: .72; } }
  @keyframes sheen { 0%, 58% { transform: translateX(-160%) skewX(-18deg); } 80%, 100% { transform: translateX(520%) skewX(-18deg); } }
  @keyframes drift1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(140px, -90px); } }
  @keyframes drift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-110px, 70px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="blob blob--1"></div><div class="blob blob--2"></div><div class="blob blob--3"></div>
  <div class="floor"><i></i><i></i></div>
  <svg class="word" viewBox="0 0 3456 2234" aria-label="webleads. Hjemmesider, der får telefonen til at ringe.">
    <text x="1980" y="1150" font-family="'Bricolage Grotesque', sans-serif" font-weight="800" font-size="250" letter-spacing="-11.25" style="fill:var(--ink)">webleads<tspan fill="#e0552b">.</tspan></text>
    <text x="1990" y="1250" font-family="'DM Sans', sans-serif" font-weight="500" font-size="46" style="fill:var(--sub)">Hjemmesider, der får telefonen til at ringe.</text>
    <text x="1990" y="1330" font-family="'DM Mono', monospace" font-size="34" style="fill:var(--small)">webleads.dk</text>
  </svg>
  <div class="scene"><div class="bob"><div class="tile" id="tile">
    <div class="face"><div class="gloss"></div><div class="sheen"></div></div>
    <div class="arrow"><svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><polyline points="12,24 20.5,45 31,29 41.5,45 51,18"/><polyline points="42.2,24.4 51,18 53.5,28.6"/></g></svg></div>
  </div></div></div>
  <canvas class="grain" id="grain" width="3456" height="2234"></canvas>
</div>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const root = document.documentElement;
  if (q.get('tema') === 'lys' || q.get('tema') === 'moerk') root.dataset.tema = q.get('tema');
  if (q.get('tekst') === 'nej') root.classList.add('uden-tekst');

  // The edge of the tile: 28 layers behind the face
  const tile = document.getElementById('tile');
  for (let i = 28; i >= 1; i--) {
    const l = document.createElement('div');
    l.className = 'l'; l.style.setProperty('--z', i);
    tile.prepend(l);
  }

  // Fine grain, drawn once, so the gradients do not band
  const g = document.getElementById('grain'), x = g.getContext('2d');
  const img = x.createImageData(g.width, g.height), d = img.data;
  let seed = 7;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let i = 0; i < d.length; i += 4) { const v = 128 + (rnd() + rnd() - 1) * 40; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  x.putImageData(img, 0, 0);

  // Fill the screen whatever its size
  const fit = () => document.getElementById('stage').style.setProperty('--s', Math.max(innerWidth / 3456, innerHeight / 2234));
  fit(); addEventListener('resize', fit);
})();
</script>
</body>
</html>

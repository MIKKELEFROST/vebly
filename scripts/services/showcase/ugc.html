<!-- Showcase for UGC-indhold: a wall of our own UGC, videos and photos. EVERYTHING shown here must be made by
     us (Mikkel, 5 Nov 2026). Until the files arrive, each tile is a placeholder (data-ph). To put a real one in:
       1. Put the file in /assets/ugc/: a video as .mp4 (H.264, 9:16, short and small) with a poster .jpg,
          a photo as .jpg or .webp.
       2. In its tile, replace <div class="ug__ph">…</div> with
            <video src="/assets/ugc/<navn>.mp4" poster="/assets/ugc/<navn>.jpg" muted loop playsinline preload="none"></video>
          or
            <img src="/assets/ugc/<navn>.jpg" alt="<hvad billedet viser>" loading="lazy" decoding="async">
       3. Remove data-ph from the <li>, and write in the caption what it is and where it was used.
     The ratio class on .ug__media (916, 45, 11) is the shape of the file: 9:16, 4:5 or 1:1. Add or remove tiles freely.
     Videos play without sound when they are on screen; a tap turns the sound on. With reduced motion they wait for a tap.
     When no placeholder is left, the "på vej" note goes away by itself.
     Styles: assets/css/show/ugc.css, behaviour: assets/js/show/ugc.js -->
<section id="eksempel" class="show show--ugc" data-sec="eksempel">
  <div class="sec-head" data-reveal="0">
    <div class="sec-head__title">
      <div class="kicker">Lavet af os</div>
      <h2 class="h2">Vores UGC.<br><span class="dim">Ligner en kunde. Lavet af os.</span></h2>
    </div>
    <p class="sec-head__lead">Videoer og billeder, vi selv har lavet til annoncer, webshops og sociale medier. Tryk på en video for at høre lyden.</p>
  </div>

  <div class="ug__bar" data-reveal="1">
    <div class="seg" role="group" aria-label="Vis video eller billeder">
      <button type="button" class="is-on" aria-pressed="true" data-ug-show="alt">Alt</button>
      <button type="button" aria-pressed="false" data-ug-show="video">Video</button>
      <button type="button" aria-pressed="false" data-ug-show="billede">Billeder</button>
    </div>
    <span class="ug__note" data-ug-note><i aria-hidden="true"></i>Nye videoer og billeder er på vej</span>
  </div>

  <ul class="ug__wall" data-ug>
    <li class="ug__tile" data-kind="video" data-ph style="--i:0">
      <figure>
        <div class="ug__media ug__media--916">
          <div class="ug__ph" aria-hidden="true"><span class="ug__play">▶</span><span class="ug__ph-t">Video kommer</span></div>
        </div>
        <figcaption><b>Unboxing</b><span>TikTok · 9:16</span></figcaption>
      </figure>
    </li>
    <li class="ug__tile" data-kind="billede" data-ph style="--i:1">
      <figure>
        <div class="ug__media ug__media--45">
          <div class="ug__ph" aria-hidden="true"><span class="ug__pic"></span><span class="ug__ph-t">Billede kommer</span></div>
        </div>
        <figcaption><b>Produkt i hverdagen</b><span>Instagram · 4:5</span></figcaption>
      </figure>
    </li>
    <li class="ug__tile" data-kind="video" data-ph style="--i:2">

      </figure>
    </li>
    <li class="ug__tile" data-kind="video" data-ph style="--i:3">
      <figure>
        <div class="ug__media ug__media--916">
          <div class="ug__ph" aria-hidden="true"><span class="ug__play">▶</span><span class="ug__ph-t">Video kommer</span></div>
        </div>

      </figure>
    </li>
    <li class="ug__tile" data-kind="billede" data-ph style="--i:4">

          <div class="ug__ph" aria-hidden="true"><span class="ug__pic"></span><span class="ug__ph-t">Billede kommer</span></div>
        </div>
        <figcaption><b>Flat lay</b><span>Webshop · 1:1</span></figcaption>
      </figure>
    </li>
    <li class="ug__tile" data-kind="video" data-ph style="--i:5">

<!-- Showcase for UGC-indhold: a wall of our own UGC, videos and photos. EVERYTHING shown here must be made by
     us (Mikkel, 5 Nov 2026). The files are ours, made on Higgsfield (assets/media/README.md, 7 Nov 2026).
     A placeholder tile (data-ph, <div class="ug__ph">…</div>) can stand in for something on its way. To add one:
       1. Put the file in /assets/media/ and list it in assets/media/README.md: a video as .mp4 (H.264, short
          and small) with a poster .jpg, a photo as .jpg or .webp.
       2. In its tile, replace <div class="ug__ph">…</div> with
            <video src="/assets/media/<navn>.mp4" poster="/assets/media/<navn>.jpg" muted loop playsinline preload="none" tabindex="0" aria-label="<hvad videoen viser>. Tryk for lyd."></video>
          or
            <img src="/assets/media/<navn>.webp" alt="<hvad billedet viser>" loading="lazy" decoding="async">
       3. Remove data-ph from the <li>, and write in the caption what it is and where it was used.
     The ratio class on .ug__media (916, 45, 11) is the shape of the file: 9:16, 4:5 or 1:1. Add or remove tiles freely.
     Videos play without sound when they are on screen; a tap turns the sound on. With reduced motion they wait for a tap.
     When no placeholder is left, the "på vej" note goes away by itself.
     Styles: assets/css/show/ugc.css, behaviour: assets/js/show/ugc.js -->
<section id="eksempel" class="show show--ugc" data-sec="eksempel">
